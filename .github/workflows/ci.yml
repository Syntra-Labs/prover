name: Prover CI & Formal Verification

on:
  push:
    branches: [leanDojo]
  pull_request:
    branches: [leanDojo]

concurrency:
  group: prover-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit-and-lint:
    name: Reviewability & Task Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Source Tasks DAG
        run: python3 scripts/lint_tasks.py

      - name: Verify PR Reviewability Diff Budget
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          python3 scripts/lint_diff_size.py --compare-base origin/${{ github.base_ref }}

  test-suite:
    name: Geometric Falsification Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Test Dependencies
        run: |
          pip install --upgrade pip
          pip install pytest numpy

      - name: Run Pytest Suite
        run: pytest tests/
